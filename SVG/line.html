<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <svg width="400" height="400" style="border: 2px solid black;">

        <line x1="20" y1="20"
              x2="300" y2="300"
              stroke="black"
              stroke-width="2" />

    </svg>

    <!-- 
        x1 is starting point x coordinate and y1 is starting point y coordinate
        x2 is ending point x coordinate and y2 is ending point y coordinate
                    |    y2
                    |----------------.(x2, y2)
                    |                | x2
                    | y1             |  
                    |--.(x1, y1)     |   
                    |  |             |   
                    |  |   x1        |
                    |  |             |   
                    |----------------------------


                 
    -->

</body>
</html>

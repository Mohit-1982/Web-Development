<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <svg height="200" width="200" style="border: 2px solid black;">
        <rect width="50" height="50" fill="blue" x="90" y="90" stroke="black" stroke-width="10" rx="10" ry="5" opacity="0.5" fill-opacity="0.9" stroke-opacity="0.2"/>
    </svg>
    <!-- 
        rx = horizontal corner radius
        ry = vertical corner radius
        opacity contorls opacity of whole element
        fill-opacity controls the opacity of inside the element
        or you can say the color inside the element which we have filled with fill property
        stroke-opacity contols the opacity of borders
    -->

</body>
</html>

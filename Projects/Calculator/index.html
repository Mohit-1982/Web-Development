<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="outer-div">
        <div class="inner-div"> <!-- inner-div starts -->
            
            <div class="result-portion"> <!-- result-portion starts -->
                <div class="result-para">0</div>
            </div> <!-- result-portion ends -->

            <div class="button-portion"> <!-- button-portion starts -->

                <button class="button b2">AC</button>
                <button class="button b2">&plusmn;</button>
                <button class="button b2">del</button>
                <button class="button">+</button>
                <button class="button b3">7</button>
                <button class="button b3">8</button>
                <button class="button b3">9</button>
                <button class="button">/</button>
                <button class="button b3">4</button>
                <button class="button b3">5</button>
                <button class="button b3">6</button>
                <button class="button">*</button>
                <button class="button b3">1</button>
                <button class="button b3">2</button>
                <button class="button b3">3</button>
                <button class="button">-</button>
                <button class="button b3">0</button>
                <button class="button b3">.</button>
                <button class="button">%</button>
                <button class="button">=</button>

            </div> <!-- button-portion ends -->

        </div> <!-- inner-div ends -->
    </div> <!-- outer-div ends -->

</body>
</html>

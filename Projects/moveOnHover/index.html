<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button>Click me</button>
</body>

<script>
    const ele = document.querySelector('button');

    const moveX = function() {
        let width = window.innerWidth - ele.offsetWidth;
        return Math.floor(Math.random() * width + 1);
    };

    const moveY = function() {
        let height = window.innerHeight - ele.offsetHeight;
        return Math.floor(Math.random() * height + 1);
    }

    ele.addEventListener('mouseenter', (e) => {
        ele.style.transform = `translate(${moveX()}px, ${moveY()}px)`;
        ele.style.color = getColor();
    });

    function getColor() {
        const hex = '0123456789ABCDEF';
        let hexCode = '#';

        for (let i = 0; i < 6; i++) {
            let random = Math.floor(Math.random() * 16);
            hexCode += hex[random];
        }

        return hexCode;
    }
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>

</head>
<body style="background-color: #212121; color: #ffffff">
    <ul id="li" class="language">
        <li>JavaScript</li>
    </ul>
</body>

<script>
    function addLang(item, id) {
        const newLang = document.createElement('li');
        const addText = document.createTextNode(item);
        newLang.appendChild(addText);
        document.getElementById(id).appendChild(newLang);
    }

    addLang("Java", "li");
    addLang("python", "li");
    addLang("TypeScript", "li");
    addLang("swift", "li");

    function addLangOptimal(lang) {
        const item = document.createElement('li');
        item.appendChild(document.createTextNode(lang));
        document.querySelector('.language').appendChild(item);
    }

    addLangOptimal("golang");
    addLangOptimal("kotlin");

    const secLi = document.querySelector('li:nth-child(2)');
    const newLi = document.createElement('li');
    newLi.textContent = "Mojo";
    secLi.replaceWith(newLi);

    const lastLang = document.querySelector('li:last-child');
    lastLang.remove();
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: white;">
    <h1 id="name">MY NAME IS MOHIT</h1>
</body>

<script>
    const run = ()=> {
        document.querySelector('h1').textContent = "Mohit is learning setTimeOut()";
    };

    const timer = setTimeout(run, 2000);

    document.querySelector('body').addEventListener('click', (e)=> {
        clearTimeout(timer);
        console.log("clicked");
    }, false);

</script>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <button>Click me</button>
        <div class="score-div">
            <span id="score">Score: 0</span>
        </div>
    </main>
</body>

<script>
    let score = 0;
    const ele = document.querySelector('button');
    const scoreSpan = document.querySelector('#score');

    const moveX = function () {
        let width = window.innerWidth - ele.offsetWidth;
        return Math.floor(Math.random() * width + 1);
    };

    const moveY = function () {
        let height = window.innerHeight - ele.offsetHeight;
        return Math.floor(Math.random() * height + 1);
    }

    function moveButton() {
        ele.style.transform = `translate(${moveX()}px, ${moveY()}px)`;
        ele.style.color = getColor();
    }

    ele.addEventListener('click', increaseScore);

    function increaseScore() {
        score++;
        scoreSpan.textContent = `Score: ${score}`;
    }

    ele.addEventListener('pointerenter', moveButton);

    function getColor() {
        const hex = '0123456789ABCDEF';
        let hexCode = '#';

        for (let i = 0; i < 6; i++) {
            let random = Math.floor(Math.random() * 16);
            hexCode += hex[random];
        }

        return hexCode;
    }
</script>

</html>

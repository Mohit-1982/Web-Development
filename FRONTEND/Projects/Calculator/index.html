<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="outer-div">
        <div class="inner-div"> <!-- inner-div starts -->
            
            <div class="result-portion"> <!-- result-portion starts -->
                <div class="result-div"></div>
            </div> <!-- result-portion ends -->

            <div class="button-portion"> <!-- button-portion starts -->

                <button class="button b2 clear">AC</button>
                <button class="button b2 sign-change">&plusmn;</button>
                <button class="button b2 del">del</button>
                <button class="button oprtr">+</button>
                <button class="button b3 num">7</button>
                <button class="button b3 num">8</button>
                <button class="button b3 num">9</button>
                <button class="button oprtr">/</button>
                <button class="button b3 num">4</button>
                <button class="button b3 num">5</button>
                <button class="button b3 num">6</button>
                <button class="button oprtr">*</button>
                <button class="button b3 num">1</button>
                <button class="button b3 num">2</button>
                <button class="button b3 num">3</button>
                <button class="button oprtr">-</button>
                <button class="button b3 num">0</button>
                <button class="button b3 decimal">.</button>
                <button class="button oprtr">%</button>
                <button class="button show">=</button>

            </div> <!-- button-portion ends -->

        </div> <!-- inner-div ends -->
    </div> <!-- outer-div ends -->

</body>
</html>

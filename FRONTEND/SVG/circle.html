<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <svg style="height:200; width:200; border:2px solid black">
        <circle cx="100" cy="100" r="50" fill="blue" stroke="red" stroke-width="10" />
        <!-- 
            by default value of cx and cy is 0
            fill is use to fill the color of a element
            stroke is border
            stroke width is border-width
            By default, anything drawn outside the SVG's visible area (viewport) gets clipped and won't be visible.
        -->
    </svg>

</body>
</html>

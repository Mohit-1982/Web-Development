<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        rect {
            animation: r 10s infinite;
        }

        @keyframes r {
            0% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: 50;
            }
        }
    </style>
</head>
<body>
    <svg width="400" height="400" style="border: 2px solid black;">
        <!-- <rect x="60" y="80" width="150" height="150" fill="yellow" stroke="red" stroke-width="10px" stroke-linejoin="round"/> -->
         <!-- <line x1="20" y1="90"
              x2="300" y2="90"
              stroke="red"
              stroke-width="10px" stroke-linecap="round"/> -->

              <rect x="60" y="80" width="150" height="150" fill="yellow" stroke="red" stroke-width="10px" stroke-dasharray="10,15,2,4" stroke-dashoffset="-20"/>
    </svg>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <svg width="100" height="100" style="border: 2px solid black;">

        <!-- <polygon points="200, 100 70, 200 330, 200" fill="red" stroke="black" stroke-width="5" /> -->
         <polygon points="55,17 73,77 25,40 84,40 36,77" fill-rule="evenodd"/>

    </svg>

    <!-- 
        in points write all the points of the polygon like,
        x1,y1 (space) x2,y2 (space) ..... so on
        fill-rule tells SVG how to determine which parts of a shape should be filled when paths overlap, intersect, or create holes.
        nonzero (default)
        evenodd -- This fills an area if a ray from that point crosses the path an odd number of times.
        It's commonly used when you want holes inside shapes.
    -->

</body>
</html>
